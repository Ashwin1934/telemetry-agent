# Akka cluster configuration for telemetry system

akka {
  actor {
    provider = cluster
    
    # Jackson serialization for cluster messages
    serialization-bindings {
      "com.telemetry.messages.RoomMessages$UpdateSensorData" = jackson-json
      "com.telemetry.messages.RoomMessages$GetRoomState" = jackson-json
      "com.telemetry.messages.RoomMessages$RoomState" = jackson-json
    }

    allow-java-serialization = off
  }

  remote {
    artery {
      enabled = on
      canonical.hostname = "127.0.0.1"  # Overridden per node via environment
      canonical.port = 0                 # Overridden per node (2551 or 2552)
      bind.hostname = 0.0.0.0
      bind.port = 0
    }
  }

  cluster {
    # Seed nodes - node 1 is the primary seed node for the cluster
    # In Docker environment, this references the akka-node-1 service
    seed-nodes = [
      "akka://telemetry-system@akka-node-1:2551"
    ]
    
    system-down-detector-strategy = keep-majority
    
    distributed-data {
      ddata.max-delta-elements = 3000
    }
    
    sharding {
      # Number of shards (10-100x number of nodes is typical)
      # With 2 nodes, 10-20 shards is reasonable
      number-of-shards = 20
      
      # Timeout for shard region operations
      shard-region-query-timeout = 3s
      
      # Entity passivation: inactive entities are stopped after 20 minutes to save memory and resources
      passivation {
        strategy = default-strategy
        default-strategy {
          idle-entity-timeout = 20m
        }
      }
    }
  }
  
  coordinated-shutdown {
    exit-jvm = on
  }
  
  # Disable Java serialization for security
  serialization-bindings {
    "java.io.Serializable" = none
  }
  
  loglevel = INFO
}

# Logging configuration
akka.log-config-on-start = false
akka.loggers = ["akka.event.slf4j.Slf4jLogger"]
akka.logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
