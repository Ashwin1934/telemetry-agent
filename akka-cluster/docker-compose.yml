version: '3.8'

services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Akka Cluster Node 1 (also runs MQTT client)
  akka-node-1:
    build:
      context: ..
      dockerfile: akka-cluster/Dockerfile
    container_name: akka-node-1
    environment:
      NODE_ID: "1"
      AKKA_REMOTE_ARTERY_CANONICAL_HOSTNAME: akka-node-1
      AKKA_REMOTE_ARTERY_CANONICAL_PORT: 2551
    ports:
      - "2551:2551"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - telemetry-net
    volumes:
      - ./logs:/app/logs
    restart: on-failure

  # Akka Cluster Node 2
  akka-node-2:
    build:
      context: ..
      dockerfile: akka-cluster/Dockerfile
    container_name: akka-node-2
    environment:
      NODE_ID: "2"
      AKKA_REMOTE_ARTERY_CANONICAL_HOSTNAME: akka-node-2
      AKKA_REMOTE_ARTERY_CANONICAL_PORT: 2552
    ports:
      - "2552:2552"
    depends_on:
      - akka-node-1
    networks:
      - telemetry-net
    volumes:
      - ./logs:/app/logs
    restart: on-failure

  # MCP Server - joins the cluster and exposes HTTP MCP endpoint
  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    environment:
      AKKA_REMOTE_ARTERY_CANONICAL_HOSTNAME: mcp-server
      AKKA_REMOTE_ARTERY_CANONICAL_PORT: 2553
    ports:
      - "8080:8080"
      - "2553:2553"
    depends_on:
      - akka-node-1
    networks:
      - telemetry-net
    volumes:
      - ./logs:/app/logs
    restart: on-failure

networks:
  telemetry-net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_logs:
